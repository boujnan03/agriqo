# Static single-page app: unknown paths fall back to index.html so client-side routes
# (/farm, /crop/:id, …) work on direct load and refresh.
server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Vite emits content-hashed file names under /assets, so they can be cached for good.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}
